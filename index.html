<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Academia ADGG0408 | Oficina virtual</title>
<style>
:root{font-family:system-ui,Arial,sans-serif;color:#182b49;background:#f3f6fb}*{box-sizing:border-box}body{margin:0}header{background:#123d74;color:white;padding:18px 26px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}header h1{margin:0;font-size:24px}header small{color:#d4e6ff}.layout{display:flex;min-height:calc(100vh - 80px)}nav{width:215px;background:white;border-right:1px solid #dbe3ef;padding:16px;flex-shrink:0}nav button{display:block;width:100%;text-align:left;margin:5px 0;background:transparent;color:#23466e}nav button.active{background:#e3efff;color:#0c4a94}main{padding:24px;flex:1;min-width:0}button{cursor:pointer;border:0;border-radius:9px;padding:10px 14px;font-weight:650;background:#1464b8;color:white}button:hover{filter:brightness(.94)}button.secondary{background:#e7effa;color:#174b80}button.danger{background:#b12c3d}input,select,textarea{width:100%;padding:10px;border:1px solid #bac9db;border-radius:7px;font:inherit;background:white}label{display:block;font-weight:600;margin:12px 0 5px}.panel{background:white;border:1px solid #e0e8f1;border-radius:13px;padding:20px;margin-bottom:17px;box-shadow:0 3px 12px #152f5310}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:14px}.stat{font-size:30px;font-weight:800;color:#11599f}.muted{color:#60728c;font-size:14px}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.toolbar input{max-width:350px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;border-bottom:1px solid #e5ebf3;padding:12px 9px}th{background:#f0f5fc}.pill{display:inline-block;border-radius:20px;background:#e7f0fc;padding:5px 9px;font-size:12px}.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0 16px}.modal{position:fixed;inset:0;background:#14243a99;display:flex;align-items:center;justify-content:center;padding:18px;z-index:4}.dialog{background:white;max-width:700px;width:100%;max-height:92vh;overflow:auto;border-radius:15px;padding:24px}.hidden{display:none!important}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.task{border-left:4px solid #2e79c3;padding:14px;background:#f6faff;margin:10px 0}.task.done{border-color:#21956a;background:#edfaf3}#toast{position:fixed;bottom:18px;right:18px;background:#173d68;color:white;padding:13px 18px;border-radius:10px;display:none;z-index:6}footer{padding:20px;color:#65758b;font-size:12px} @media(max-width:760px){.layout{display:block}nav{width:100%;display:flex;overflow:auto;gap:5px;padding:8px}nav button{white-space:nowrap;width:auto}main{padding:12px}header{padding:14px}}</style></head><body>
<header><div><h1>◈ Academia ADGG0408 <small> | Oficina virtual · Nivel 1</small></h1><small>Empresa ficticia: Horizonte Digital S.L. · Entorno de prácticas</small></div><div><button class="secondary" onclick="exportData()">Exportar datos</button> <button class="secondary" onclick="document.getElementById('importfile').click()">Importar</button><input type="file" id="importfile" accept=".json" hidden onchange="importData(event)"></div></header>
<div class="layout"><nav id="nav"></nav><main id="main"></main></div><footer>Simulador educativo independiente. Datos ficticios. Guardado local en este navegador; no enviar datos personales reales.</footer><div id="modal" class="modal hidden"><div class="dialog" id="dialog"></div></div><div id="toast"></div>
<script>
const seed={empleados:[{id:1,nombre:"Lucía Martín",departamento:"Marketing",puesto:"Especialista SEO",email:"lucia.martin@ejemplo.test",alta:"2023-09-04",estado:"Activo",salario:32000},{id:2,nombre:"Carlos Vega",departamento:"Tecnología",puesto:"Desarrollador web",email:"carlos.vega@ejemplo.test",alta:"2022-03-14",estado:"Activo",salario:38000},{id:3,nombre:"Sara López",departamento:"RR. HH.",puesto:"Técnica de selección",email:"sara.lopez@ejemplo.test",alta:"2024-01-15",estado:"Activo",salario:29500},{id:4,nombre:"David Ruiz",departamento:"Ventas",puesto:"Ejecutivo comercial",email:"david.ruiz@ejemplo.test",alta:"2021-06-01",estado:"Permiso",salario:34000}],candidatos:[{id:1,nombre:"Ana Torres",vacante:"Analista de datos",fase:"Nuevo",email:"ana.torres@ejemplo.test",nota:"Experiencia en SQL"},{id:2,nombre:"Pablo Gil",vacante:"Analista de datos",fase:"Entrevista",email:"pablo.gil@ejemplo.test",nota:"Entrevista técnica pendiente"},{id:3,nombre:"Elena Castro",vacante:"Técnico de soporte",fase:"Preselección",email:"elena.castro@ejemplo.test",nota:"Experiencia en atención al cliente"}],vacantes:[{id:1,titulo:"Analista de datos",departamento:"Tecnología",plazas:1,estado:"Abierta"},{id:2,titulo:"Técnico de soporte",departamento:"Tecnología",plazas:2,estado:"Abierta"}],formaciones:[{id:1,curso:"Protección de datos",empleado:"Lucía Martín",estado:"Completada",fecha:"2026-09-15"},{id:2,curso:"Prevención de riesgos",empleado:"Carlos Vega",estado:"Pendiente",fecha:"2026-11-12"}],ausencias:[{id:1,empleado:"David Ruiz",tipo:"Permiso",inicio:"2026-10-20",fin:"2026-10-27",estado:"Aprobada"}],completados:[]};
const schemas={
 empleados:{title:"Empleados",fields:{nombre:["Nombre completo","text"],departamento:["Departamento","select",["RR. HH.","Tecnología","Ventas","Marketing","Finanzas","Operaciones"]],puesto:["Puesto","text"],email:["Correo electrónico","email"],alta:["Fecha de alta","date"],estado:["Estado","select",["Activo","Permiso","Baja"]],salario:["Salario bruto anual (€)","number"]}},
 candidatos:{title:"Candidatos",fields:{nombre:["Nombre completo","text"],vacante:["Vacante","text"],fase:["Fase","select",["Nuevo","Preselección","Entrevista","Oferta","Contratado","Descartado"]],email:["Correo electrónico","email"],nota:["Observaciones","text"]}},
 vacantes:{title:"Vacantes",fields:{titulo:["Título","text"],departamento:["Departamento","select",["RR. HH.","Tecnología","Ventas","Marketing","Finanzas","Operaciones"]],plazas:["Plazas","number"],estado:["Estado","select",["Abierta","Pausada","Cerrada"]]}},
 formaciones:{title:"Formación",fields:{curso:["Curso","text"],empleado:["Empleado","text"],estado:["Estado","select",["Pendiente","En curso","Completada"]],fecha:["Fecha","date"]}},
 ausencias:{title:"Ausencias",fields:{empleado:["Empleado","text"],tipo:["Tipo","select",["Vacaciones","Permiso","Baja médica","Otros"]],inicio:["Inicio","date"],fin:["Fin","date"],estado:["Estado","select",["Solicitada","Aprobada","Rechazada"]]}}
};
const lessons=[{id:1,title:"Alta de un empleado",text:"Registra a Marta Soler en Tecnología como Diseñadora UX, con estado Activo y fecha de alta de hoy.",test:d=>d.empleados.some(x=>x.nombre.toLowerCase().includes("marta soler")&&x.departamento==="Tecnología")},{id:2,title:"Proceso de selección",text:"Cambia la fase del candidato Pablo Gil a Oferta.",test:d=>d.candidatos.some(x=>x.nombre==="Pablo Gil"&&x.fase==="Oferta")},{id:3,title:"Nueva vacante",text:"Crea una vacante abierta de Responsable de formación en RR. HH.",test:d=>d.vacantes.some(x=>x.titulo.toLowerCase().includes("responsable de formación")&&x.estado==="Abierta")},{id:4,title:"Plan de formación",text:"Registra el curso Excel avanzado para Sara López con estado Pendiente.",test:d=>d.formaciones.some(x=>x.curso.toLowerCase().includes("excel avanzado")&&x.empleado==="Sara López")},{id:5,title:"Gestión de ausencias",text:"Registra una solicitud de vacaciones para Lucía Martín.",test:d=>d.ausencias.some(x=>x.empleado==="Lucía Martín"&&x.tipo==="Vacaciones")}];
let data;try{data=JSON.parse(localStorage.getItem("aulahr_v1"))||structuredClone(seed)}catch(e){data=structuredClone(seed)};for(const k in seed)if(!Array.isArray(data[k]))data[k]=[];
let page="campus",search="";
const save=()=>localStorage.setItem("aulahr_v1",JSON.stringify(data));
const esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function notice(s){let t=document.getElementById("toast");t.textContent=s;t.style.display="block";setTimeout(()=>t.style.display="none",2600)}
function navTo(p){page=p;search="";render()}
function render(){let entries=[["campus","🎓 Mi academia"],["oficina","📁 Prácticas de oficina"],["inicio","⌂ Panel RR. HH."],["empleados","♙ Empleados"],["candidatos","♧ Candidatos"],["vacantes","▣ Vacantes"],["formaciones","▤ Formación"],["ausencias","◷ Ausencias"],["informes","▥ Informes"],["ejercicios","✓ Ejercicios"],["evaluacion","📝 Evaluación"],["profesor","👩‍🏫 Profesor"]];document.getElementById("nav").innerHTML=entries.map(([p,t])=>`<button class="${page===p?"active":""}" onclick="navTo('${p}')">${t}</button>`).join("")+`<button onclick="resetAll()" class="secondary" style="margin-top:22px">↺ Reiniciar prácticas</button>`;const m=document.getElementById("main");if(schemas[page])return renderTable(m,page);if(page==="oficina")renderOffice(m);else if(page==="campus")renderCampus(m);else if(page==="evaluacion")renderEvaluation(m);else if(page==="profesor")renderTeacher(m);else if(page==="inicio"){m.innerHTML=`<h2>Panel de Recursos Humanos</h2><p class="muted">Gestiona la plantilla, el talento y la formación de Horizonte Digital S.L.</p><div class="grid">${[["Empleados",data.empleados.length],["Candidatos",data.candidatos.length],["Vacantes abiertas",data.vacantes.filter(x=>x.estado==="Abierta").length],["Formaciones pendientes",data.formaciones.filter(x=>x.estado==="Pendiente").length]].map(([a,b])=>`<div class="panel"><div class="muted">${a}</div><div class="stat">${b}</div></div>`).join("")}</div><div class="panel"><h3>Bienvenido al laboratorio</h3><p>Explora los módulos, añade registros, edítalos y resuelve las actividades. Los cambios se guardan en este navegador.</p><button onclick="navTo('ejercicios')">Ir a ejercicios →</button></div>`}else if(page==="informes")renderReports(m);else renderLessons(m)}
const questions=[
["¿Cuál es la finalidad principal de un ATS? ",["Gestionar candidaturas","Emitir facturas","Controlar inventario"],0],
["¿Qué fase suele seguir a la preselección?",["Contratación directa","Entrevista","Baja laboral"],1],
["¿Qué dato debe tratarse con especial protección?",["Color del logotipo","Información personal del empleado","Número de vacantes"],1],
["¿Qué permite medir un indicador de formación?",["Cursos completados","Ventas de producto","Stock de almacén"],0],
["¿Qué es una vacante?",["Una ausencia","Un puesto por cubrir","Un contrato finalizado"],1],
["¿Para qué sirve un informe de plantilla?",["Analizar distribución de personal","Enviar nóminas reales","Eliminar empleados"],0]
];
let student=localStorage.getItem("aulahr_student")||"Alumno/a";
let answers={};try{answers=JSON.parse(localStorage.getItem("aulahr_answers")||"{}")}catch(e){}
function setStudent(){let x=prompt("Escribe tu nombre o identificador de clase (no uses datos sensibles):",student);if(x&&x.trim()){student=x.trim();localStorage.setItem("aulahr_student",student);render()}}
function renderCampus(m){let done=lessons.filter(x=>x.test(data)).length;let grade=Object.keys(answers).length===questions.length?questions.filter((q,i)=>answers[i]===q[2]).length:null;
m.innerHTML=`<h2>Bienvenido/a al campus virtual</h2><div class="panel"><h3>Estudiante: ${esc(student)}</h3><p class="muted">Campus individual de prácticas de RR. HH. · Empresa ficticia Horizonte Digital S.L.</p><button class="secondary" onclick="setStudent()">Cambiar estudiante</button></div><div class="grid"><div class="panel"><div class="muted">Retos prácticos completados</div><div class="stat">${done}/${lessons.length}</div><button onclick="navTo('ejercicios')">Ir a prácticas</button></div><div class="panel"><div class="muted">Evaluación teórica</div><div class="stat">${grade===null?"Pendiente":Math.round(grade/questions.length*10)+"/10"}</div><button onclick="navTo('evaluacion')">Abrir evaluación</button></div><div class="panel"><div class="muted">Módulos disponibles</div><div class="stat">5</div><button onclick="navTo('inicio')">Entrar al simulador</button></div></div><div class="panel"><h3>Itinerario de aprendizaje</h3><p><b>Unidad 1.</b> Organización y fichas de empleados</p><p><b>Unidad 2.</b> Reclutamiento y selección</p><p><b>Unidad 3.</b> Gestión de vacantes</p><p><b>Unidad 4.</b> Formación y desarrollo</p><p><b>Unidad 5.</b> Ausencias, indicadores y evaluación</p><p>Completa los cinco retos y la prueba teórica. Al finalizar, descarga tu entrega para el docente.</p><button onclick="exportDelivery()">Descargar entrega del alumno</button></div>`}
function renderEvaluation(m){let score=questions.filter((q,i)=>answers[i]===q[2]).length,finished=Object.keys(answers).length===questions.length;m.innerHTML=`<h2>Evaluación teórica</h2><p>Selecciona una respuesta por pregunta. Se guardan automáticamente en este ordenador.</p>${questions.map((q,i)=>`<div class="panel"><b>${i+1}. ${esc(q[0])}</b>${q[1].map((a,j)=>`<label style="font-weight:400"><input type="radio" style="width:auto" name="q${i}" value="${j}" ${answers[i]===j?"checked":""} onchange="answerQuestion(${i},${j})"> ${esc(a)}</label>`).join("")}</div>`).join("")}<div class="panel"><h3>${finished?"Resultado: "+Math.round(score/questions.length*10)+"/10":"Respuestas: "+Object.keys(answers).length+"/"+questions.length}</h3>${finished?"<p>Has respondido todas las preguntas. Puedes revisar tus respuestas antes de entregar.</p>":"<p>Completa todas las preguntas para conocer tu nota.</p>"}<button onclick="exportDelivery()">Descargar entrega</button> <button class="secondary" onclick="clearAnswers()">Repetir evaluación</button></div>`}
function answerQuestion(i,j){answers[i]=j;localStorage.setItem("aulahr_answers",JSON.stringify(answers));render()}
function clearAnswers(){if(confirm("¿Reiniciar la evaluación?")){answers={};localStorage.removeItem("aulahr_answers");render()}}
function exportDelivery(){let completed=lessons.map(x=>({reto:x.id,titulo:x.title,completado:x.test(data)}));let score=questions.filter((q,i)=>answers[i]===q[2]).length;download("entrega_aulahr_"+student.replace(/[^a-z0-9_-]/gi,"_")+".json",JSON.stringify({formato:"AulaHR entrega v1",alumno:student,fecha:new Date().toISOString(),retos:completed,evaluacion:{respondidas:Object.keys(answers).length,total:questions.length,aciertos:score,nota:Math.round(score/questions.length*100)/10},respuestas:answers,datos:data,oficina:office},null,2),"application/json")}
function renderTeacher(m){m.innerHTML=`<h2>Zona docente</h2><div class="panel"><h3>Guía de utilización</h3><p>Distribuye este archivo HTML a tus alumnos. Cada estudiante trabaja en su propio ordenador y guarda su progreso en su navegador. Al finalizar, pulsa <b>Descargar entrega del alumno</b> en el campus y envía el JSON al profesor.</p><p><b>Prácticas:</b> cinco retos verificables automáticamente. <b>Evaluación:</b> seis preguntas tipo test con calificación sobre 10.</p><p><b>Corrección:</b> el archivo de entrega contiene el estado de los retos, la nota y los registros simulados. Puedes abrirlo con un editor de texto o importarlo en el simulador para revisar los datos.</p><p><b>Limitación:</b> esta edición es local y no sincroniza notas entre ordenadores ni dispone de autenticación o protección contra modificaciones. No debe usarse como plataforma oficial de exámenes.</p><button onclick="exportDelivery()">Exportar entrega de ejemplo</button></div><div class="panel"><h3>Actividades propuestas</h3><p>Sesión 1: fichas de personal · Sesión 2: selección y vacantes · Sesión 3: formación y ausencias · Sesión 4: informes y evaluación final.</p></div>`}

let office;try{office=JSON.parse(localStorage.getItem("adgg0408_office")||"null")}catch(e){}if(!office)office={records:[],notes:{}};
const activities=[
["UF0517 · Organización y RR. HH.","Consulta la ficha de Sara López e identifica su departamento."],
["UF0518 · Correspondencia","Registra una carta recibida de Papelería Norte para Administración."],
["UF0519 · Documentación comercial","Registra una factura ficticia de material de oficina por 125 euros."],
["UF0521 · Comunicación escrita","Redacta una respuesta educada confirmando la recepción de una solicitud."],
["UF0513 · Archivo","Registra un documento y clasifícalo como Archivado."],
["UF0514 · Reproducción","Registra una solicitud de 10 copias de un documento."]
];
function saveOffice(){localStorage.setItem("adgg0408_office",JSON.stringify(office))}
function renderOffice(m){m.innerHTML=`<h2>Prácticas de oficina · Nivel 1</h2><p>Realiza las tareas paso a paso. Utiliza solo datos inventados.</p><div class="panel"><h3>Registrar un documento</h3><form id="officeform"><label>Tipo de documento</label><select name="tipo"><option>Carta</option><option>Factura</option><option>Mensaje</option><option>Documento</option><option>Solicitud de copias</option></select><label>Asunto o remitente</label><input name="asunto" required placeholder="Ej.: Papelería Norte"><label>Destinatario o carpeta</label><input name="destino" required placeholder="Ej.: Administración"><label>Cantidad o importe</label><input name="cantidad" type="number" min="0" step="0.01" value="0"><label>Estado</label><select name="estado"><option>Recibido</option><option>Pendiente</option><option>Archivado</option><option>Enviado</option></select><div class="actions"><button type="submit">Guardar documento</button></div></form></div><div class="panel"><h3>Documentos registrados</h3><div class="tablewrap"><table><tr><th>Tipo</th><th>Asunto</th><th>Destino</th><th>Cantidad</th><th>Estado</th></tr>${office.records.map(x=>`<tr><td>${esc(x.tipo)}</td><td>${esc(x.asunto)}</td><td>${esc(x.destino)}</td><td>${esc(x.cantidad)}</td><td>${esc(x.estado)}</td></tr>`).join("")}</table></div></div><h3>Seis actividades guiadas</h3>${activities.map(([title,task],i)=>`<div class="task"><b>${i+1}. ${title}</b><p>${task}</p><label>¿Qué has hecho?</label><textarea id="onote${i}" rows="2">${esc(office.notes[i]||"")}</textarea><div class="actions"><button class="secondary" onclick="office.notes[${i}]=document.getElementById('onote${i}').value;saveOffice();notice('Respuesta guardada')">Guardar respuesta</button></div></div>`).join("")}`;document.getElementById("officeform").onsubmit=e=>{e.preventDefault();let f=e.target;office.records.push({tipo:f.tipo.value,asunto:f.asunto.value,destino:f.destino.value,cantidad:f.cantidad.value,estado:f.estado.value});saveOffice();render();notice("Documento guardado")}}

function renderTable(m,k){let s=schemas[k],fields=Object.keys(s.fields),rows=data[k].filter(x=>fields.some(f=>String(x[f]??"").toLowerCase().includes(search.toLowerCase())));m.innerHTML=`<h2>${s.title}</h2><div class="panel"><div class="toolbar"><input id="q" placeholder="Buscar en ${s.title.toLowerCase()}..." value="${esc(search)}" oninput="search=this.value;updateRows('${k}')"><button onclick="openForm('${k}')">+ Nuevo registro</button><span class="muted" id="count">${rows.length} registros</span></div><div class="tablewrap"><table><thead><tr>${fields.map(f=>`<th>${esc(s.fields[f][0])}</th>`).join("")}<th>Acciones</th></tr></thead><tbody id="tbody"></tbody></table></div></div>`;updateRows(k)}
function updateRows(k){let fields=Object.keys(schemas[k].fields),rows=data[k].filter(x=>fields.some(f=>String(x[f]??"").toLowerCase().includes(search.toLowerCase())));document.getElementById("count").textContent=rows.length+" registros";document.getElementById("tbody").innerHTML=rows.map(x=>`<tr>${fields.map(f=>`<td>${f==="estado"||f==="fase"?`<span class="pill">${esc(x[f])}</span>`:esc(x[f])}</td>`).join("")}<td><button class="secondary" onclick="openForm('${k}',${x.id})">Editar</button> <button class="danger" onclick="removeRow('${k}',${x.id})">Borrar</button></td></tr>`).join("")||`<tr><td colspan="${fields.length+1}">No hay registros.</td></tr>`}
function openForm(k,id){let s=schemas[k],x=data[k].find(v=>v.id===id)||{};document.getElementById("dialog").innerHTML=`<h2>${id?"Editar":"Nuevo registro"} · ${s.title}</h2><form id="recordform"><div class="formgrid">${Object.entries(s.fields).map(([f,[label,type,options]])=>`<div><label for="f_${f}">${esc(label)}</label>${type==="select"?`<select id="f_${f}" name="${f}" required>${options.map(o=>`<option value="${esc(o)}" ${x[f]===o?"selected":""}>${esc(o)}</option>`).join("")}</select>`:`<input id="f_${f}" name="${f}" type="${type}" value="${esc(x[f]??"")}" ${type==="number"?'min="0" step="1"':""} required>`}</div>`).join("")}</div><div class="actions"><button type="submit">Guardar</button><button type="button" class="secondary" onclick="closeModal()">Cancelar</button></div></form>`;document.getElementById("modal").classList.remove("hidden");document.getElementById("recordform").onsubmit=e=>{e.preventDefault();let obj={id:id||Math.max(0,...data[k].map(x=>x.id))+1};for(let f of Object.keys(s.fields)){let el=e.target.elements[f];obj[f]=el.type==="number"?Number(el.value):el.value.trim()}if(id){data[k][data[k].findIndex(v=>v.id===id)]=obj}else data[k].push(obj);save();closeModal();render();notice("Registro guardado correctamente")}}
function closeModal(){document.getElementById("modal").classList.add("hidden")}
function removeRow(k,id){if(confirm("¿Eliminar este registro ficticio?")){data[k]=data[k].filter(x=>x.id!==id);save();render();notice("Registro eliminado")}}
function renderReports(m){let groups=(arr,key)=>Object.entries(arr.reduce((a,x)=>(a[x[key]]=(a[x[key]]||0)+1,a),{}));let block=(title,items)=>`<div class="panel"><h3>${title}</h3>${items.map(([name,n])=>`<p>${esc(name)} · <strong>${n}</strong></p><div style="height:12px;background:#e8eef7;border-radius:8px;overflow:hidden"><div style="height:100%;width:${Math.round(n/Math.max(1,...items.map(x=>x[1]))*100)}%;background:#2378c4"></div></div>`).join("")||"Sin datos"}</div>`;m.innerHTML=`<h2>Informes de RR. HH.</h2><div class="grid">${block("Plantilla por departamento",groups(data.empleados,"departamento"))}${block("Candidatos por fase",groups(data.candidatos,"fase"))}${block("Formación por estado",groups(data.formaciones,"estado"))}${block("Ausencias por tipo",groups(data.ausencias,"tipo"))}</div><div class="panel"><h3>Indicadores</h3><p>Salario bruto anual total (ficticio): <strong>${data.empleados.reduce((s,x)=>s+(Number(x.salario)||0),0).toLocaleString("es-ES")} €</strong></p><button onclick="downloadCSV()">Exportar empleados a CSV</button></div>`}
function renderLessons(m){let passed=lessons.filter(x=>x.test(data)).length;m.innerHTML=`<h2>Ejercicios prácticos</h2><p>Completa los retos utilizando los módulos de la izquierda. La comprobación se realiza automáticamente sobre tus registros.</p><div class="panel"><strong>Progreso: ${passed} de ${lessons.length} ejercicios</strong><div style="background:#e6edf5;border-radius:12px;margin-top:12px;height:14px"><div style="background:#22966f;width:${passed/lessons.length*100}%;height:100%;border-radius:12px"></div></div></div>${lessons.map(x=>`<div class="task ${x.test(data)?"done":""}"><strong>${x.test(data)?"✓":"○"} Reto ${x.id}: ${x.title}</strong><p>${x.text}</p><button class="secondary" onclick="navTo('${["","empleados","candidatos","vacantes","formaciones","ausencias"][x.id]}')">Abrir módulo</button></div>`).join("")}<div class="panel"><h3>Para el docente</h3><p>Propón que cada alumno entregue el archivo JSON exportado o una captura de sus resultados. Puedes reiniciar la simulación antes de cada sesión.</p></div>`}
function exportData(){download("aulahr_practicas.json",JSON.stringify(data,null,2),"application/json")}
function download(name,content,type){let a=document.createElement("a"),url=URL.createObjectURL(new Blob([content],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function downloadCSV(){let f=Object.keys(schemas.empleados.fields),csv=[f,...data.empleados.map(x=>f.map(k=>String(x[k]??"").replace(/"/g,'""')))].map(r=>r.map(v=>`"${v}"`).join(";")).join("\r\n");download("empleados_aulahr.csv","\ufeff"+csv,"text/csv;charset=utf-8")}
function importData(e){let file=e.target.files[0];if(!file)return;let reader=new FileReader();reader.onload=()=>{try{let d=JSON.parse(reader.result);if(!Object.keys(seed).every(k=>Array.isArray(d[k])))throw Error();if(!confirm("¿Sustituir los datos actuales por los del archivo?"))return;data=d;save();render();notice("Datos importados")}catch(err){alert("Archivo no válido para AulaHR")}};reader.readAsText(file);e.target.value=""}
function resetAll(){if(confirm("¿Restaurar todos los datos ficticios y borrar tus prácticas guardadas?")){data=structuredClone(seed);save();render();notice("Datos restaurados")}}
document.getElementById("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});render();
</script></body></html>
